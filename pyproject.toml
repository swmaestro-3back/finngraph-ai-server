[project]
name = "finngraph-ai-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mintuchel", email = "max3627@naver.com" }
]
requires-python = ">=3.14"

dependencies = [
    "fastapi[standard]>=0.141.0",
    "langchain-google-genai>=4.2.6",
    "neo4j>=6.2.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]

[project.scripts]
finngraph-ai-server = "finngraph_ai_server:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]