[project]
name = "finngraph-kg-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mintuchel", email = "max3627@naver.com" }
]
requires-python = ">=3.14"

dependencies = [
    "boto3>=1.34",
    "fastapi[standard]>=0.141.0",
    "langchain-aws>=1.7.4",
    "langgraph>=1.0",
    "neo4j>=6.2.0",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.14.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "pytest-asyncio>=1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# 앱 코드는 app/ 을 루트로 하는 평면 import(core, api, graph ...)를 쓴다.
pythonpath = [".", "app"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: 로컬 ETL DB 필요 (finngraph-etl 에서 docker compose up -d db + 마이그레이션 적용)",
]
