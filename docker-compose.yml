name: finngraph-ai-server

# Neo4j·Postgres 는 여기서 띄우지 않는다 — finngraph-etl 스택의 인스턴스를 공유한다.
# 먼저 ../finngraph-etl 에서 `docker compose up -d db neo4j neo4j-init` 로 띄워둘 것.
# (그래야 아래 external 네트워크 finngraph-etl_default 가 존재한다)

services:
  api:
    build: .
    image: finngraph-ai-server
    container_name: finngraph-ai-server
    ports:
      # port mapping
      - "8000:8000"
    env_file:
      # .env를 컨테이너 환경변수로 주입
      - .env
    environment:
      # 컨테이너에서는 파일 로그를 남기지 않고 stdout으로만 출력한다.
      - LOG_TO_FILE=false
      # 콘솔 로그 레벨. 운영 중 임시 디버깅이 필요하면 DEBUG로 올린다.
      - LOG_LEVEL=INFO
      # .env 의 NEO4J_URI(bolt://localhost:7687)는 로컬 실행용이라 컨테이너 안에선 안 된다.
      # 공유 네트워크에서 'neo4j'는 ETL 스택의 neo4j 서비스명으로 해석된다.
      - NEO4J_URI=bolt://neo4j:7687
      # 수혜주 기능의 Postgres 도 같은 이유로 ETL 네트워크의 서비스명(db)으로 접속한다.
      # DB 계정 기본값은 finngraph-etl compose 의 기본값과 같고, 다르면 .env 에 ETL_DB_* 로 넣는다.
      - DATABASE_URL=postgresql://${ETL_DB_USER:-threeback}:${ETL_DB_PASSWORD:-12345678}@db:5432/${ETL_DB_NAME:-finngraph}
    networks:
      - etl
    # 로그는 Docker의 json-file 드라이버가 수집·로테이션한다.
    #   docker compose logs -f api  로 조회
    #   max-size 초과 시 회전, 최대 max-file 개 보관 (총 ~30MB)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 컨테이너가 죽으면 자동 재시작. 단, 수동으로 stop 한 경우엔 재시작하지 않는다.
    # ETL 스택보다 먼저 뜨거나 ETL 이 잠시 내려가도 재시작으로 회복한다.
    restart: unless-stopped

networks:
  etl:
    external: true
    name: finngraph-etl_default
